name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run linter
        run: ruff check app/ tests/ scripts/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Validate artifact manifests
        run: python scripts/validate_artifacts.py --require-promoted-bundle

      - name: Smoke import workflow scripts
        run: |
          python scripts/prepare_data.py --help
          python scripts/train_obb.py --help
          python scripts/evaluate_obb.py --help
          python scripts/promote_model.py --help

      - name: Smoke inference with mocked detector
        run: python scripts/smoke_inference.py --mock

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t aerial-obb-api:test .
